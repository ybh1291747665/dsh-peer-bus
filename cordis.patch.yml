# dsh-peer-bus bundle patch: mounted as one insert over the profile root.
#
# One row: the bus itself — tools and delivery.
#
# There used to be a second row, `peer-bus-invariant`, the package-owned
# durable-shape checks behind the package's `./invariant` export. DSH 0.2.1
# removed the runtime invariants plugin and every package's `./invariant` export
# ("使用这些诊断入口的开发者需相应调整扩展或自定义 profile"), and
# `@deepseek-ai/dsh-invariants` is no longer present in the install at all, so
# that row could never activate again. It is gone, along with src/invariant.js.
# The checks it ran were always inert on the base, web and headless bundles
# anyway: only `dsh-sdk-minimal` mounted the `invariants` service.
#
# This ships default-deny, so installing the plugin alone grants no session the
# ability to message another. Add allow rules through the profile's own
# cordis.patch.yml, targeting the bus row's id:
#
#   - id: peer-bus
#     config:
#       allow:
#         - from: 'session-abc'
#           to: 'session-def'
#
# A patch replaces the targeted row's whole `config`, so restate every key you
# still want rather than only the one you are changing.
- insert:
    - id: peer-bus
      name: 'dsh-peer-bus'
      config:
        allow: []
        maxMessageBytes: 16384
        maxSendsPerWindow: 10
        rateWindowMs: 60000
