# E2E overlay for scripts/e2e-xproc.mjs, which needs the cross-process transport on.
#
# It is a COPY of bus.e2e.patch.yml plus `crossProcess: true`, not an addition to it:
# both overlays insert a `peer-bus` row, and `insert` appends, so layering them would
# mount the plugin twice and the second bus would fight the first over the same
# socket and registry.
#
# Five changes over the production overlay:
#   1. `headless-runner` is disabled. It is the one-shot task driver, and it
#      rejects a boot with no task before the agent loop can come up; these
#      scripts need a live loop they can create their own agents on.
#   2. `@deepseek-ai/dsh-invariants` is mounted so the package's `./invariant`
#      companion actually activates. No shipped profile except `dsh-sdk-minimal`
#      mounts that service, so without this row the companion is inert and its
#      checks would never be exercised. Running it across the whole conversation
#      is the false-positive test: a legitimate bus message must not trip it.
#   3. `@deepseek-ai/dsh-agent-preset-registry` is mounted with two declared
#      presets. Only the web profile mounts that registry, so on the plain
#      headless profile a resume that forgot to mount a session's preset would
#      look fine — which is exactly how that bug survived. Two presets, neither
#      the default, let the script assert the RECORDED preset was mounted rather
#      than the default.
#   4. The allowlist uses ONE `sameWorkspace` rule rather than id patterns, so the
#      workspace rule is exercised end to end. That also makes the deny probe
#      meaningful: the scripts put the talking sessions in the package workspace
#      and the probe session in a temp directory, so the same single rule both
#      grants the conversation and refuses the outsider. An id-pattern rule would
#      have denied the outsider for the unrelated reason that no pattern named it.
#      Id patterns stay covered by the unit tests.
#   5. `@deepseek-ai/dsh-workspace` is mounted for the same reason as (3): only
#      the web bundle mounts it, so on the plain headless profile the bus's
#      archive protection would have nothing to read and the archived-target
#      path would be untested. Mounting the REAL registry lets the script archive
#      a session through the public API and assert the refusal that follows.
- id: headless-runner
  disabled: true

- insert:
    - id: invariants
      name: '@deepseek-ai/dsh-invariants'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: peer-bus
      name: 'dsh-peer-bus'
      config:
        allow:
          - sameWorkspace: true
        maxMessageBytes: 16384
        # Raised for the checks only. The scenarios drive a few pairs hard enough to
        # sit right on the production ceiling of 10 — measured peaks of 9 and 10 in a
        # single run — so any timing variation tipped one over and the run failed with
        # `rate-limited` for reasons that had nothing to do with what it tests. The
        # ceiling itself is covered by unit tests, including the refund on a failed
        # delivery and the expiry sweep.
        maxSendsPerWindow: 100
        rateWindowMs: 60000
        # Short on purpose: the e2e has to observe the busy-to-pending handoff
        # without holding a real turn open for the production 30s bound.
        askBusyTimeoutMs: 300
        # The whole point of this overlay.
        crossProcess: true
        crossProcessTimeoutMs: 2000
        crossProcessDeliverTimeoutMs: 60000
        # Short so "a killed peer stops being reported" converges within the test's
        # patience. The production default and the expiry path are unit-tested.
        crossProcessRosterCacheMs: 400
        # Short so the script can watch a resumed session be released for idleness and
        # then be resumed again, without waiting the production ten minutes.
        resumedIdleMs: 1500

    - id: peer-bus-invariant
      name: 'dsh-peer-bus/invariant'

    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: e2e-default

    # The default preset. A resumed session that fell back to this one instead of
    # its own would be composed wrongly, which is what the e2e asserts against.
    - id: preset-e2e-default
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: e2e-default
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are the E2E DEFAULT preset.'
              suffix: ''

    # The preset the probe session records, so the assertion can tell them apart.
    - id: preset-e2e-probe
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: e2e-probe
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'You are the E2E PROBE preset.'
              suffix: ''
